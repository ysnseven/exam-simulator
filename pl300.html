    // ─────────────────────────────────────────────────────────────────────────
    // AI VERIFY
    // ─────────────────────────────────────────────────────────────────────────
    function AIVerify({q,T}){
      const{apiKey,setApiKey}=useApiKey();
      const[status,setStatus]=useState("idle");
      const[result,setResult]=useState(null);
      const[showKeyModal,setShowKeyModal]=useState(false);
      const[errMsg,setErrMsg]=useState("");

      const runVerify=async(key)=>{
        setStatus("loading");setResult(null);setErrMsg("");
        try{
          const optionsText=q.options.map(o=>`${o.key}) ${o.text}`).join("\n");
          const prompt=`You are a Microsoft certification exam expert. Carefully analyze this exam question and determine the correct answer(s).\n\nQUESTION:\n${q.question}\n\nOPTIONS:\n${optionsText}\n\nThe answer key says: ${q.answers.join(", ")}${q.explanation?`\nProvided explanation: ${q.explanation}`:""}\n\nYour task:\n1. Determine the correct answer(s) based on your knowledge\n2. State your confidence: High / Medium / Low\n3. Agree or disagree with the answer key, and explain why.\n\nRespond ONLY with valid JSON (no markdown fences):\n{\n  "aiAnswers": ["B"],\n  "agrees": true,\n  "confidence": "High",\n  "reasoning": "2-3 sentence explanation."\n}`;
          const res=await fetch("https://api.anthropic.com/v1/messages",{
            method:"POST",
            headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
            body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:600,messages:[{role:"user",content:prompt}]})
          });
          const data=await res.json();
          if(data.error){
            const msg=data.error.message||"API error";
            if(msg.toLowerCase().includes("auth")||res.status===401){setErrMsg("API Key ไม่ถูกต้องหรือหมดอายุ");setApiKey("");}
            else{setErrMsg(msg);}
            setStatus("error");return;
          }
          const text=(data.content||[]).map(b=>b.text||"").join("").trim();
          const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
          setResult(parsed);setStatus("done");
        }catch(err){setErrMsg("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");setStatus("error");}
      };

      const handleClickVerify=()=>{if(!apiKey){setShowKeyModal(true);return;}runVerify(apiKey);};
      const handleKeySaved=(key)=>{setApiKey(key);runVerify(key);};

      if(status==="idle") return(
        <>
          <div style={{marginBottom:12}}>
            {apiKey&&<div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:6,marginBottom:6}}>
              <span style={{fontSize:10,color:"#10b981"}}>🔑 API Key พร้อมใช้งาน</span>
              <button onClick={()=>setApiKey("")} style={{background:"transparent",border:"none",color:"#ef4444",fontSize:10,cursor:"pointer",textDecoration:"underline",padding:0}}>ลบ Key</button>
            </div>}
            <button onClick={handleClickVerify}
              style={{width:"100%",padding:"10px 14px",background:"transparent",border:"1.5px dashed #8b5cf655",borderRadius:11,color:"#8b5cf6",fontWeight:700,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}
              onMouseOver={e=>{e.currentTarget.style.background="#8b5cf611";e.currentTarget.style.borderColor="#8b5cf6aa";}}
              onMouseOut={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.borderColor="#8b5cf655";}}>
              <span style={{fontSize:16}}>🤖</span>
              {apiKey?"AI Verify — Double-check this answer":"AI Verify — ใส่ API Key เพื่อใช้งาน"}
            </button>
          </div>
          {showKeyModal&&<ApiKeyModal onClose={()=>setShowKeyModal(false)} onSave={handleKeySaved}/>}
        </>
      );

      if(status==="loading") return(
        <div style={{marginBottom:12,padding:"14px 18px",background:"#8b5cf608",border:"1.5px solid #8b5cf633",borderRadius:13,display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:18,height:18,borderRadius:"50%",border:"2.5px solid #8b5cf644",borderTopColor:"#8b5cf6",animation:"spin 0.8s linear infinite",flexShrink:0}}/>
          <span style={{color:"#8b5cf6",fontSize:13,fontWeight:600}}>Claude กำลังวิเคราะห์คำตอบ…</span>
        </div>
      );

      if(status==="error") return(
        <>
          <div style={{marginBottom:12,padding:"12px 16px",background:"#ef444410",border:"1.5px solid #ef444440",borderRadius:13,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span style={{color:"#ef4444",fontSize:13,flex:1}}>⚠️ {errMsg||"ไม่สามารถวิเคราะห์ได้"}</span>
            <div style={{display:"flex",gap:8}}>
              {!apiKey&&<button onClick={()=>setShowKeyModal(true)} style={{background:"#ef444420",border:"1px solid #ef444440",borderRadius:7,color:"#ef4444",fontSize:12,cursor:"pointer",padding:"4px 10px",fontWeight:600}}>🔑 ใส่ Key ใหม่</button>}
              <button onClick={()=>setStatus("idle")} style={{background:"transparent",border:"1px solid #ef444440",borderRadius:7,color:"#ef4444",fontSize:12,cursor:"pointer",padding:"4px 10px"}}>ปิด</button>
            </div>
          </div>
          {showKeyModal&&<ApiKeyModal onClose={()=>setShowKeyModal(false)} onSave={handleKeySaved}/>}
        </>
      );

      if(status==="done"&&result){
        const agrees=result.agrees;
        const bc=agrees?"#10b981":"#f59e0b";
        const tc=agrees?"#10b981":"#f59e0b";
        const confColor=result.confidence==="High"?"#10b981":result.confidence==="Medium"?"#f59e0b":"#ef4444";
        return(
          <div style={{marginBottom:12,padding:"14px 18px",background:agrees?"#10b98108":"#f59e0b08",border:`1.5px solid ${bc}44`,borderRadius:13,animation:"fadeIn 0.3s ease"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              <span style={{fontSize:15}}>🤖</span>
              <span style={{color:tc,fontWeight:800,fontSize:14}}>AI Analysis</span>
              <span style={{background:agrees?"#10b98120":"#f59e0b20",color:tc,border:`1px solid ${bc}66`,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>{agrees?"✅ เฉลยถูกต้อง":"⚠️ เฉลยอาจผิด"}</span>
              <span style={{background:confColor+"20",color:confColor,border:`1px solid ${confColor}44`,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700,marginLeft:"auto"}}>Confidence: {result.confidence}</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              <div style={{background:T.insetBg,borderRadius:9,padding:"9px 12px"}}>
                <div style={{color:T.textFaint,fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}}>📋 Answer Key</div>
                <div style={{color:T.text,fontWeight:800,fontSize:15}}>{q.answers.join(", ")}</div>
              </div>
              <div style={{background:agrees?"#10b98112":"#f59e0b12",borderRadius:9,padding:"9px 12px",border:`1px solid ${bc}33`}}>
                <div style={{color:T.textFaint,fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}}>🤖 AI Answer</div>
                <div style={{color:tc,fontWeight:800,fontSize:15}}>{(result.aiAnswers||[]).join(", ")}</div>
              </div>
            </div>
            <div style={{color:T.textSub,fontSize:13,lineHeight:1.8,borderTop:`1px solid ${bc}22`,paddingTop:10}}>
              <span style={{color:T.textMuted,fontWeight:700,fontSize:11,textTransform:"uppercase",letterSpacing:0.5}}>Reasoning: </span>
              {result.reasoning}
            </div>
            <button onClick={()=>setStatus("idle")} style={{marginTop:10,background:"transparent",border:"none",color:T.textFaint,fontSize:11,cursor:"pointer",textDecoration:"underline",padding:0}}>🔄 Re-verify</button>
          </div>
        );
      }
      return null;
    }

    // ─────────────────────────────────────────────────────────────────────────
    // EXAM SCREEN
    // ─────────────────────────────────────────────────────────────────────────
    function ExamScreen({questions,timedMode,timePerQ,onFinish,onBack}){
      const{T}=useTheme();
      const[idx,setIdx]=useState(0);
      const[selected,setSelected]=useState(new Set());
      const[submitted,setSubmitted]=useState(false);
      const[results,setResults]=useState({});
      const[elapsed,setElapsed]=useState(0);
      const[qTimer,setQTimer]=useState(timePerQ);
      const[showNav,setShowNav]=useState(false);
      const[confirmBack,setConfirmBack]=useState(false);
      const timerRef=useRef(null);
      const qTimerRef=useRef(null);

      const q=questions[idx];
      const isMulti=q.type==="multi";
      const correctSet=useMemo(()=>new Set(q.answers),[q]);
      const correctSoFar=useMemo(()=>Object.values(results).filter(r=>r.correct).length,[results]);
      const answeredCount=useMemo(()=>Object.keys(results).length,[results]);

      useEffect(()=>{timerRef.current=setInterval(()=>setElapsed(e=>e+1),1000);return()=>clearInterval(timerRef.current);},[]);

      useEffect(()=>{
        if(!timedMode)return;
        setQTimer(timePerQ);
        qTimerRef.current=setInterval(()=>{
          setQTimer(t=>{
            if(t<=1){clearInterval(qTimerRef.current);handleAutoSubmit();return 0;}
            return t-1;
          });
        },1000);
        return()=>clearInterval(qTimerRef.current);
      },[idx,timedMode,timePerQ]);// eslint-disable-line

      const handleAutoSubmit=useCallback(()=>{
        if(submitted)return;
        const correct=selected.size>0&&isAnswerCorrect();
        setSubmitted(true);
        setResults(p=>({...p,[idx]:{correct,category:q.category}}));
      },[submitted,selected,idx,q]);// eslint-disable-line

      const isAnswerCorrect=useCallback(()=>{
        if(isMulti){if(selected.size!==correctSet.size)return false;for(const k of selected)if(!correctSet.has(k))return false;return true;}
        return selected.has(q.answer);
      },[isMulti,selected,correctSet,q]);

      const toggleOption=useCallback((key)=>{
        if(submitted)return;
        if(isMulti){setSelected(p=>{const n=new Set(p);n.has(key)?n.delete(key):n.add(key);return n;});}
        else{setSelected(new Set([key]));}
      },[submitted,isMulti]);

      const handleSubmit=useCallback(()=>{
        if(!selected.size&&!timedMode)return;
        clearInterval(qTimerRef.current);
        const correct=isAnswerCorrect();
        setSubmitted(true);
        setResults(p=>({...p,[idx]:{correct,category:q.category}}));
      },[selected,timedMode,isAnswerCorrect,idx,q]);

      const goNext=useCallback(()=>{
        if(idx+1>=questions.length){clearInterval(timerRef.current);clearInterval(qTimerRef.current);onFinish({results,elapsed});}
        else{setIdx(i=>i+1);setSelected(new Set());setSubmitted(false);}
      },[idx,questions.length,results,elapsed,onFinish]);

      const goPrev=useCallback(()=>{
        if(idx>0){setIdx(i=>i-1);setSelected(new Set());setSubmitted(false);}
      },[idx]);

      const handleSkip=useCallback(()=>{
        clearInterval(qTimerRef.current);
        if(!submitted){setResults(p=>({...p,[idx]:{correct:false,category:q.category,skipped:true}}));}
        goNext();
      },[submitted,idx,q,goNext]);

      const handleReset=useCallback(()=>{
        clearInterval(qTimerRef.current);
        setSelected(new Set());setSubmitted(false);
        setResults(p=>{const n={...p};delete n[idx];return n;});
      },[idx]);

      const jumpTo=useCallback((i)=>{setIdx(i);setSelected(new Set());setSubmitted(false);},[]);

      useEffect(()=>{
        const handler=(e)=>{
          if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
          if(/^[A-Ea-e]$/.test(e.key)&&!submitted){
            const key=e.key.toUpperCase();
            if(q.options.find(o=>o.key===key))toggleOption(key);
          }
          if((e.key==="Enter"||e.key===" ")&&e.target.tagName!=="BUTTON"){
            e.preventDefault();
            if(!submitted&&selected.size)handleSubmit();
            else if(submitted)goNext();
          }
          if(e.key==="ArrowLeft")goPrev();
          if(e.key==="ArrowRight"&&submitted)goNext();
        };
        window.addEventListener("keydown",handler);
        return()=>window.removeEventListener("keydown",handler);
      },[submitted,selected,q,toggleOption,handleSubmit,goNext,goPrev]);

      const stateOf=useCallback((key)=>{
        if(!submitted)return selected.has(key)?"sel":"idle";
        if(correctSet.has(key))return"correct";
        if(selected.has(key))return"wrong";
        return"idle";
      },[submitted,selected,correctSet]);

      const wasCorrect=submitted&&isAnswerCorrect();
      const catIdx=useMemo(()=>{const cats=extractCategories(questions);return cats.indexOf(q.category);},[questions,q]);
      const domainColor=colorFor(catIdx<0?0:catIdx);
      const exStyle=wasCorrect?T.exCorrect:T.exWrong;
      const timerPct=timedMode?qTimer/timePerQ:1;
      const timerColor=timerPct<0.25?T.timerWarn:timerPct<0.5?"#f59e0b":T.timerOk;

      return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
        <div style={{background:T.topbar,borderBottom:`1px solid ${T.topbarBorder}`,backdropFilter:"blur(12px)",padding:"8px 16px",display:"flex",alignItems:"center",gap:8,position:"sticky",top:0,zIndex:10,flexWrap:"wrap"}}>
          <button onClick={()=>setConfirmBack(true)} style={{background:T.elevBg,border:`1px solid ${T.border}`,borderRadius:8,color:T.textSub,fontSize:12,padding:"5px 10px",cursor:"pointer",fontWeight:600,flexShrink:0}}>← Back</button>
          <span style={{color:T.borderSub}}>|</span>
          <span style={{color:"#3b82f6",fontWeight:900,fontSize:12,fontFamily:"'Sora',sans-serif",flexShrink:0}}>PL-300 Exam</span>
          <span style={{color:T.textMuted,fontSize:12,flexShrink:0}}>Q {idx+1}/{questions.length}</span>
          <div style={{flex:1}}/>
          <span style={{color:correctSoFar>0?"#10b981":T.textFaint,fontSize:12,fontWeight:600,flexShrink:0}}>
            ✓ {correctSoFar}{answeredCount>0&&<span style={{color:T.textMuted,fontWeight:400}}> · {Math.round((correctSoFar/answeredCount)*100)}%</span>}
          </span>
          <div style={{background:T.cardBg,border:`1px solid ${T.border}`,borderRadius:8,padding:"4px 10px",fontFamily:"monospace",fontSize:12,color:T.textSub,flexShrink:0}}>⏱ {formatTime(elapsed)}</div>
          <button onClick={()=>setShowNav(v=>!v)} style={{background:T.elevBg,border:`1px solid ${T.border}`,borderRadius:8,color:T.textSub,fontSize:12,padding:"5px 10px",cursor:"pointer",fontWeight:600,flexShrink:0}}>
            ☰ {answeredCount}/{questions.length}
          </button>
        </div>

        <div style={{background:T.topbar,padding:"4px 16px 0"}}>
          <ProgressBar value={answeredCount} max={questions.length}/>
          {timedMode&&!submitted&&<div style={{marginTop:2}}><ProgressBar value={qTimer} max={timePerQ} color={timerColor} thin/></div>}
        </div>

        <div style={{flex:1,padding:"18px 16px 100px",maxWidth:840,margin:"0 auto",width:"100%"}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:14,flexWrap:"wrap"}}>
            <span style={{background:domainColor+"20",color:domainColor,border:`1px solid ${domainColor}40`,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:0.4,maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{q.category}</span>
            <span style={{background:(isMulti?"#f59e0b":"#3b82f6")+"20",color:isMulti?"#f59e0b":"#3b82f6",border:`1px solid ${isMulti?"#f59e0b":"#3b82f6"}40`,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>
              {isMulti?`Multi-Select (${q.answers.length} answers)`:"Single Choice"}
            </span>
            {timedMode&&!submitted&&(
              <span style={{background:timerColor+"20",color:timerColor,border:`1px solid ${timerColor}40`,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700,marginLeft:"auto",flexShrink:0}}>⏱ {qTimer}s</span>
            )}
          </div>

          <Card style={{padding:"18px 20px",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
              <span style={{color:T.textFaint,fontSize:11}}>Q{idx+1}/{questions.length}</span>
              <span style={{color:T.borderSub,fontSize:11}}>·</span>
              <span style={{background:"#3b82f615",color:"#3b82f6",borderRadius:5,padding:"1px 7px",fontSize:11,fontWeight:700}}>
                ต้นฉบับ #{q.originalNum??q.num}
              </span>
              {q.sourceFile&&(
                <span style={{color:T.textFaint,fontSize:10,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:180}} title={q.sourceFile}>
                  📄 {q.sourceFile}
                </span>
              )}
            </div>
            <p style={{color:T.text,fontSize:"clamp(13px,2.3vw,15px)",lineHeight:1.9,margin:0,fontWeight:500}}>{q.question}</p>
          </Card>

          <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:18}}>
            {q.options.map((opt)=>{
              const s=T[stateOf(opt.key)];
              return(<button key={opt.key} onClick={()=>toggleOption(opt.key)} disabled={submitted}
                style={{display:"flex",alignItems:"flex-start",gap:11,background:s.bg,border:`1.5px solid ${s.border}`,borderRadius:11,padding:"11px 14px",cursor:submitted?"default":"pointer",transition:"all 0.16s",textAlign:"left",width:"100%"}}>
                <span style={{width:26,height:26,borderRadius:isMulti?5:7,background:s.lBg,color:s.lText,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:12,flexShrink:0}}>
                  {submitted&&correctSet.has(opt.key)?"✓":submitted&&selected.has(opt.key)&&!correctSet.has(opt.key)?"✗":opt.key}
                </span>
                <span style={{color:s.text,fontSize:14,lineHeight:1.75,paddingTop:3}}>{opt.text}</span>
              </button>);
            })}
          </div>

          {!submitted&&(
            <div style={{color:T.textFaint,fontSize:11,marginBottom:12,textAlign:"center"}}>
              Press <kbd style={{background:T.elevBg,border:`1px solid ${T.borderSub}`,borderRadius:4,padding:"1px 5px",fontSize:10}}>A</kbd>–<kbd style={{background:T.elevBg,border:`1px solid ${T.borderSub}`,borderRadius:4,padding:"1px 5px",fontSize:10}}>E</kbd> to select · <kbd style={{background:T.elevBg,border:`1px solid ${T.borderSub}`,borderRadius:4,padding:"1px 5px",fontSize:10}}>Enter</kbd> to submit
            </div>
          )}

          {submitted&&(
            <div style={{background:exStyle.bg,border:`1.5px solid ${exStyle.border}`,borderRadius:13,padding:"14px 18px",marginBottom:16,animation:"fadeIn 0.25s ease"}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:7}}>
                <span style={{fontSize:15}}>{wasCorrect?"✅":"❌"}</span>
                <span style={{color:exStyle.title,fontWeight:800,fontSize:14}}>
                  {wasCorrect?"Correct!":`Incorrect — Answer: ${q.answers.join(", ")}`}
                </span>
              </div>
              <p style={{color:T.textSub,fontSize:13,lineHeight:1.85,margin:0}}>{q.explanation}</p>
            </div>
          )}
          {submitted&&<AIVerify q={q} T={T}/>}

          <div style={{display:"flex",gap:8}}>
            <button onClick={goPrev} disabled={idx===0}
              style={{padding:"13px 16px",background:T.cardBg,border:`1px solid ${T.border}`,borderRadius:11,color:idx===0?T.textFaint:T.textSub,fontWeight:700,fontSize:13,cursor:idx===0?"not-allowed":"pointer",flexShrink:0}}>
              ← Prev
            </button>
            {!submitted?(
              <>
                <button onClick={handleSkip}
                  style={{padding:"13px 14px",background:T.insetBg,border:`1px solid ${T.border}`,borderRadius:11,color:T.textMuted,fontWeight:600,fontSize:13,cursor:"pointer",flexShrink:0}}>
                  Skip »
                </button>
                <button onClick={handleSubmit} disabled={!selected.size}
                  style={{flex:1,padding:"13px",background:selected.size?"linear-gradient(135deg,#3b82f6,#6d28d9)":T.elevBg,border:"none",borderRadius:11,color:selected.size?"#fff":T.textFaint,fontWeight:700,fontSize:15,cursor:selected.size?"pointer":"not-allowed",transition:"all 0.18s",fontFamily:"'Sora',sans-serif",boxShadow:selected.size?"0 4px 20px #3b82f633":"none"}}>
                  Submit Answer
                </button>
              </>
            ):(
              <>
                <button onClick={handleReset}
                  style={{padding:"13px 14px",background:T.insetBg,border:`1px solid ${T.border}`,borderRadius:11,color:T.textMuted,fontWeight:600,fontSize:13,cursor:"pointer",flexShrink:0}}>
                  ↺ Redo
                </button>
                <button onClick={goNext}
                  style={{flex:1,padding:"13px",background:"linear-gradient(135deg,#3b82f6,#6d28d9)",border:"none",borderRadius:11,color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"'Sora',sans-serif",boxShadow:"0 4px 20px #3b82f633"}}>
                  {idx+1>=questions.length?"Finish Exam →":"Next Question →"}
                </button>
              </>
            )}
          </div>
        </div>

        {showNav&&<>
          <div onClick={()=>setShowNav(false)} style={{position:"fixed",inset:0,background:"#0006",zIndex:199}}/>
          <QuestionNav questions={questions} currentIdx={idx} results={results} onJump={jumpTo} onClose={()=>setShowNav(false)}/>
        </>}

        {confirmBack&&(
          <div style={{position:"fixed",inset:0,background:"#0008",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
            <Card style={{padding:24,maxWidth:340,width:"100%",textAlign:"center"}}>
              <div style={{fontSize:32,marginBottom:10}}>⚠️</div>
              <div style={{color:T.text,fontWeight:700,fontSize:16,marginBottom:8}}>Exit Exam?</div>
              <div style={{color:T.textSub,fontSize:13,marginBottom:20,lineHeight:1.6}}>Your progress will be lost. Return to setup screen?</div>
              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>setConfirmBack(false)} style={{flex:1,padding:"11px",background:T.elevBg,border:`1px solid ${T.border}`,borderRadius:10,color:T.textSub,fontWeight:700,fontSize:13,cursor:"pointer"}}>Stay</button>
                <button onClick={()=>{clearInterval(timerRef.current);clearInterval(qTimerRef.current);onBack();}} style={{flex:1,padding:"11px",background:"#ef4444",border:"none",borderRadius:10,color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>Exit</button>
              </div>
            </Card>
          </div>
        )}
      </div>);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // RESULTS SCREEN
    // ─────────────────────────────────────────────────────────────────────────
    function ResultsScreen({results,elapsed,questions,categories,onRestart}){
      const{T}=useTheme();
      const resultArr=useMemo(()=>Object.values(results),[results]);
      const total=resultArr.length;
      const correct=resultArr.filter(r=>r.correct).length;
      const skipped=resultArr.filter(r=>r.skipped).length;
      const accuracy=total?Math.round((correct/total)*100):0;
      const passed=accuracy>=70;

      const catStats=useMemo(()=>
        categories.map((c,i)=>{
          const cr=resultArr.filter(r=>r.category===c);
          const cc=cr.filter(r=>r.correct).length;
          return{cat:c,color:colorFor(i),total:cr.length,correct:cc,pct:cr.length?Math.round((cc/cr.length)*100):0};
        }).filter(s=>s.total>0)
      ,[categories,resultArr]);

      const resultBg=passed?T.passBg:T.failBg;
      const resultBorder=passed?T.passBorder:T.failBorder;
      const resultColor=passed?"#10b981":"#ef4444";

      return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px 80px"}}>
        <div style={{maxWidth:680,width:"100%"}}>
          <div style={{textAlign:"center",marginBottom:26}}>
            <div style={{fontSize:48,marginBottom:10}}>{passed?"🏆":"📚"}</div>
            <h1 style={{fontSize:"clamp(22px,5vw,36px)",fontWeight:900,color:T.text,margin:"0 0 6px",fontFamily:"'Sora',sans-serif"}}>
              {passed?"Exam Complete!":"Keep Studying!"}
            </h1>
            <p style={{color:T.textMuted,fontSize:14,margin:0}}>{passed?"Great work — you passed!":"Aim for 70%+ to pass."}</p>
          </div>

          <div style={{background:resultBg,border:`1.5px solid ${resultBorder}`,borderRadius:18,padding:24,marginBottom:14,textAlign:"center"}}>
            <div style={{fontSize:"clamp(42px,10vw,62px)",fontWeight:900,color:resultColor,fontFamily:"'Sora',sans-serif",lineHeight:1}}>{accuracy}%</div>
            <div style={{color:T.textMuted,fontSize:14,marginTop:5}}>{correct} correct · {total-correct-skipped} wrong · {skipped} skipped</div>
            <div style={{marginTop:12}}><ProgressBar value={correct} max={total} color={resultColor}/></div>
            <div style={{marginTop:4,fontSize:11,color:T.textFaint}}>Pass threshold: 70%</div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
            {[
              {label:"Total Time",value:formatTime(elapsed),icon:"⏱"},
              {label:"Avg / Q",value:`${total?Math.round(elapsed/total):0}s`,icon:"⚡"},
              {label:"Score",value:`${accuracy}%`,icon:"🎯"},
            ].map(s=>(
              <Card key={s.label} style={{padding:12,textAlign:"center"}}>
                <div style={{fontSize:16,marginBottom:2}}>{s.icon}</div>
                <div style={{color:T.text,fontWeight:800,fontSize:16}}>{s.value}</div>
                <div style={{color:T.textMuted,fontSize:10,textTransform:"uppercase",letterSpacing:0.5}}>{s.label}</div>
              </Card>
            ))}
          </div>

          <Card style={{padding:18,marginBottom:16}}>
            <SectionLabel>Performance by Topic</SectionLabel>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {catStats.map(s=>(
                <div key={s.cat}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{color:T.text,fontSize:13,fontWeight:600,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginRight:8}} title={s.cat}>{s.cat}</span>
                    <span style={{color:s.color,fontSize:13,fontWeight:700,flexShrink:0}}>{s.pct}% ({s.correct}/{s.total})</span>
                  </div>
                  <ProgressBar value={s.correct} max={s.total} color={s.color}/>
                </div>
              ))}
            </div>
          </Card>

          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            <button onClick={()=>onRestart("same")} style={{padding:"13px 8px",background:T.cardBg,border:`1px solid ${T.border}`,borderRadius:11,color:T.textSub,fontWeight:700,fontSize:13,cursor:"pointer"}}>↩ Retry</button>
            <button onClick={()=>onRestart("reshuffle")} style={{padding:"13px 8px",background:T.cardBg,border:`1px solid ${T.border}`,borderRadius:11,color:T.textSub,fontWeight:700,fontSize:13,cursor:"pointer"}}>🔀 Reshuffle</button>
            <button onClick={()=>onRestart("home")} style={{padding:"13px 8px",background:"linear-gradient(135deg,#3b82f6,#6d28d9)",border:"none",borderRadius:11,color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"'Sora',sans-serif"}}>🏠 New Setup</button>
          </div>
        </div>
      </div>);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // APP ROOT
    // ─────────────────────────────────────────────────────────────────────────
    function App(){
      const[isDark,setIsDark]=useState(true);
      const T=isDark?DARK:LIGHT;
      const toggleTheme=useCallback(()=>setIsDark(d=>!d),[]);
      const[apiKey,setApiKey]=useState("");

      const[screen,setScreen]=useState("home");
      const[examQ,setExamQ]=useState([]);
      const[examCategories,setExamCategories]=useState([]);
      const[examResults,setExamResults]=useState({});
      const[examElapsed,setExamElapsed]=useState(0);
      const[examConfig,setExamConfig]=useState({timedMode:false,timePerQ:90});
      const keyRef=useRef(0);

      const handleStart=useCallback(({catState,shuffleQ,allQ,timedMode,timePerQ,categories})=>{
        let qs=[];
        (categories||[]).forEach(c=>{
          const{enabled,limit}=catState[c]||{};
          if(!enabled)return;
          let cqs=allQ.filter(q=>q.category===c);
          if(shuffleQ)cqs=shuffle(cqs);
          qs=qs.concat(cqs.slice(0,limit));
        });
        if(shuffleQ)qs=shuffle(qs);
        qs=qs.map((q,i)=>({...q,num:i+1}));
        keyRef.current+=1;
        setExamQ(qs);
        setExamCategories(categories||extractCategories(qs));
        setExamConfig({timedMode,timePerQ});
        setScreen("exam");
      },[]);

      const handleFinish=useCallback(({results,elapsed})=>{
        setExamResults(results);setExamElapsed(elapsed);setScreen("results");
      },[]);

      const handleBack=useCallback(()=>setScreen("home"),[]);

      const handleRestart=useCallback((mode)=>{
        if(mode==="home"){setScreen("home");return;}
        if(mode==="reshuffle"){keyRef.current+=1;setExamQ(p=>shuffle([...p]).map((q,i)=>({...q,num:i+1})));}
        setExamResults({});setScreen("exam");
      },[]);

      return(<ApiKeyCtx.Provider value={{apiKey,setApiKey}}>
      <ThemeCtx.Provider value={{T,toggleTheme}}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&display=swap');
          *,*::before,*::after{box-sizing:border-box}
          html,body{margin:0;padding:0}
          body{background:${T.pageBg};font-family:'Sora',system-ui,sans-serif;color:${T.text};-webkit-font-smoothing:antialiased;transition:background 0.3s,color 0.3s;}
          button{font-family:inherit}
          ::-webkit-scrollbar{width:5px}
          ::-webkit-scrollbar-track{background:${T.scrollTrack}}
          ::-webkit-scrollbar-thumb{background:${T.scrollThumb};border-radius:3px}
          @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
          @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
          @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
          body::before{content:'';position:fixed;inset:0;background-image:${T.grid==="none"?"none":T.grid};background-size:44px 44px;pointer-events:none;z-index:0;transition:background-image 0.3s;opacity:${T.mode==="light"?0:1};}
          #root{position:relative;z-index:1}
          kbd{display:inline-block}
        `}</style>
        {screen==="home"    && <HomeScreen onStart={handleStart}/>}
        {screen==="exam"    && <ExamScreen key={keyRef.current} questions={examQ} timedMode={examConfig.timedMode} timePerQ={examConfig.timePerQ} onFinish={handleFinish} onBack={handleBack}/>}
        {screen==="results" && <ResultsScreen results={examResults} elapsed={examElapsed} questions={examQ} categories={examCategories} onRestart={handleRestart}/>}
        <ThemeToggle/>
      </ThemeCtx.Provider>
      </ApiKeyCtx.Provider>);
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
